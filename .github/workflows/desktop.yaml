# Builds Tubedroid for Windows: an MSI installer with mpv (libmpv-2.dll) inside. Pushes to the
# custom branch also publish it on the Releases page, marked as a pre-release so update checkers
# for the phone app, such as Obtainium, skip it.

name: Desktop

on:
  push:
    paths:
      - 'desktop/**'
      - 'tubearchivist/**'
      - 'core/src/main/res/drawable/**'
      - 'gradle/**'
      - '*.kts'
      - '.github/workflows/desktop.yaml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  screens:
    name: Render pages
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          java-version: 17
          distribution: temurin
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Render pages with sample data
        run: ./gradlew -PdesktopOnly :desktop:renderScreens
      - name: Upload pictures
        uses: actions/upload-artifact@v7
        with:
          name: desktop-screens
          path: desktop/build/screens/*.png

  windows:
    name: Windows installer
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          java-version: 17
          distribution: temurin
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # The development build of libmpv, the same library Jellyfin Media Player plays with
      - name: Download libmpv
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/mpv"
          gh release download --repo zhongfly/mpv-winbuild --pattern 'mpv-dev-x86_64-2*.7z' --dir "$RUNNER_TEMP/mpv" \
            || gh release download --repo shinchiro/mpv-winbuild-cmake --pattern 'mpv-dev-x86_64-2*.7z' --dir "$RUNNER_TEMP/mpv"
          archive=$(ls "$RUNNER_TEMP"/mpv/*.7z | head -n 1)
          echo "Using $(basename "$archive")"
          7z e "$archive" -o"desktop/resources/windows-x64" libmpv-2.dll -r -y
          ls -l desktop/resources/windows-x64/libmpv-2.dll

      - name: Build the installer
        shell: bash
        run: ./gradlew -PdesktopOnly -PdesktopVersion=1.0.${{ github.run_number }} :desktop:packageMsi

      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: Tubedroid-windows
          path: desktop/build/compose/binaries/main/msi/*.msi

      - name: Publish release
        if: github.ref == 'refs/heads/custom'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: desktop-1.0.${{ github.run_number }}
          name: Tubedroid for Windows 1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          make_latest: false
          fail_on_unmatched_files: true
          body: |
            Built from ${{ github.sha }} on the custom branch.
            Run the .msi to install, or to update an older install. It plays videos with mpv; an
            mpv.conf in %APPDATA%\Tubedroid\mpv changes how.
          files: desktop/build/compose/binaries/main/msi/*.msi
